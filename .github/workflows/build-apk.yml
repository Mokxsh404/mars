name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK for HC-05
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools 33.0.2 & Platform
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Download & Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          sudo unzip -q gradle-8.4-bin.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Build Android APK
        env:
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: "https://services.gradle.org/distributions/gradle-8.4-bin.zip"
        run: |
          export PATH="/opt/gradle-8.4/bin:$PATH"
          cd mobile_app
          cordova platform add android@12.0.1
          cordova plugin add https://github.com/don/BluetoothSerial.git
          cordova build android --debug

      - name: Prepare APK File
        run: cp mobile_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk ./MarsRover-HC05-Control.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarsRover-HC05-Control.apk
          path: ./MarsRover-HC05-Control.apk

      - name: Publish Direct Release APK Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Mars Rover APK v1.0.0
          files: ./MarsRover-HC05-Control.apk
