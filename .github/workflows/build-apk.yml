name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK for HC-05
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools 33.0.2
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Build Android APK
        run: |
          cd mobile_app
          cordova platform add android@12.0.1
          cordova plugin add https://github.com/don/BluetoothSerial.git
          sed -i 's/new XmlParser/new groovy.xml.XmlParser/g' platforms/android/CordovaLib/cordova.gradle || true
          cordova build android --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MarsRover-HC05-Control.apk
          path: mobile_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
