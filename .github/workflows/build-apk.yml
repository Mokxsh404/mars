name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK for HC-05
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK with Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK File
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./MarsRover-HC05-Control.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarsRover-HC05-Control.apk
          path: ./MarsRover-HC05-Control.apk

      - name: Publish Direct Release APK Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Mars Rover APK v1.0.0
          files: ./MarsRover-HC05-Control.apk
