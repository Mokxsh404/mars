name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK for HC-05
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova CLI
        run: npm install -g cordova@12.0.0

      - name: Build Android APK
        run: |
          cd mobile_app
          cordova platform add android@10.1.2
          cordova plugin add https://github.com/don/BluetoothSerial.git
          cordova build android --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MarsRover-HC05-Control.apk
          path: mobile_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
